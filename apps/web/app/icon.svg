<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="256" fill="url(#bg)"/>
  <!-- Photo-based icon via existing public asset -->
  <g clip-path="url(#clip)">
    <image href="/sameer.svg" x="16" y="16" width="480" height="480" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="16"/>
</svg>

